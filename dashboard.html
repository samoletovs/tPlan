<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Дашборд прогресса — Tplan</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#222;max-width:700px;margin:0 auto;padding:20px;min-height:100vh}
  h1{font-size:1.4em;margin-bottom:4px}
  .sub{color:#888;font-size:.82em;margin-bottom:20px}
  .card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{font-size:1em;margin-bottom:12px;color:#0d9668}

  /* Stats */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
  .stat-box{background:#f9f9f9;border-radius:10px;padding:14px;text-align:center}
  .stat-num{font-size:1.8em;font-weight:700;color:#0d9668}
  .stat-label{font-size:.75em;color:#888;margin-top:2px}

  /* Chart */
  .chart-wrap{position:relative;width:100%;height:200px;margin:10px 0}
  canvas{width:100%!important;height:100%!important}

  /* Table */
  .log-table{width:100%;border-collapse:collapse;font-size:.82em}
  .log-table th,.log-table td{padding:6px 8px;text-align:left;border-bottom:1px solid #e0e0e0}
  .log-table th{color:#888;font-weight:500}
  .good{color:#0d9668;font-weight:600}
  .miss{color:#d63031;font-weight:600}
  .easy{color:#0d9668}.normal{color:#e67e22}.hard{color:#d63031}

  .empty{text-align:center;color:#aaa;padding:40px;font-size:.9em}
  .hidden{display:none}
</style>
</head>
<body>

<h1>📊 Дашборд прогресса</h1>
<div class="sub" id="subTitle">Данные загружаются из logs/data.js</div>

<div id="dashboard" class="hidden">

  <!-- Общая статистика -->
  <div class="card">
    <h2>📈 Общая статистика</h2>
    <div class="stat-grid" id="statGrid"></div>
  </div>

  <!-- График веса -->
  <div class="card hidden" id="weightCard">
    <h2>⚖️ Вес</h2>
    <div class="chart-wrap"><canvas id="weightChart"></canvas></div>
  </div>

  <!-- Графики повторений по упражнениям -->
  <div class="card">
    <h2>💪 Повторения по упражнениям</h2>
    <div class="chart-wrap"><canvas id="repsChart"></canvas></div>
  </div>

  <!-- Сложность -->
  <div class="card">
    <h2>🎯 Сложность по тренировкам</h2>
    <div class="chart-wrap"><canvas id="diffChart"></canvas></div>
  </div>

  <!-- Все логи -->
  <div class="card">
    <h2>📋 Все тренировки</h2>
    <table class="log-table" id="logTable">
      <thead><tr><th>Дата</th><th>Тренировка</th><th>Длит.</th><th>Вес</th><th>Стрик</th></tr></thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>

</div>

<div id="emptyMsg" class="empty">Пока нет данных. Попроси Copilot обновить logs/data.js.</div>

<!-- Logs data (maintained by Copilot) -->
<script src="logs/data.js"></script>
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

<script>
// Auto-load from LOGS (defined in logs/data.js)
let logs = (typeof LOGS !== 'undefined' && Array.isArray(LOGS)) ? [...LOGS] : [];
logs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

// ===== RENDER =====
function renderDashboard() {
  if (!logs.length) return;
  
  document.getElementById('emptyMsg').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('subTitle').textContent = `✅ Загружено ${logs.length} тренировок`;

  renderStats();
  renderWeightChart();
  renderRepsChart();
  renderDiffChart();
  renderLogTable();
}

function renderStats() {
  const grid = document.getElementById('statGrid');
  const totalWorkouts = logs.length;
  const totalMinutes = logs.reduce((s, l) => s + (l.duration_min || 0), 0);
  const totalSets = logs.reduce((s, l) => s + (l.exercises?.length || 0), 0);
  const totalReps = logs.reduce((s, l) => s + (l.exercises || []).reduce((ss, e) => ss + (e.actual || 0), 0), 0);
  const lastWeight = [...logs].reverse().find(l => l.body_weight_kg)?.body_weight_kg || '—';
  const maxStreak = Math.max(...logs.map(l => l.streak || 0), 0);

  grid.innerHTML = `
    <div class="stat-box"><div class="stat-num">${totalWorkouts}</div><div class="stat-label">Тренировок</div></div>
    <div class="stat-box"><div class="stat-num">${totalMinutes}</div><div class="stat-label">Минут всего</div></div>
    <div class="stat-box"><div class="stat-num">${totalSets}</div><div class="stat-label">Подходов</div></div>
    <div class="stat-box"><div class="stat-num">${totalReps}</div><div class="stat-label">Повторений</div></div>
    <div class="stat-box"><div class="stat-num">${lastWeight}</div><div class="stat-label">Последний вес (кг)</div></div>
    <div class="stat-box"><div class="stat-num">🔥 ${maxStreak}</div><div class="stat-label">Макс. стрик</div></div>
  `;
}

function renderWeightChart() {
  const weightLogs = logs.filter(l => l.body_weight_kg);
  const card = document.getElementById('weightCard');
  if (!weightLogs.length) { card.classList.add('hidden'); return; }
  card.classList.remove('hidden');

  const ctx = document.getElementById('weightChart').getContext('2d');
  if (window._weightChart) window._weightChart.destroy();
  window._weightChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: weightLogs.map(l => l.date.slice(5)),
      datasets: [{
        label: 'Вес (кг)',
        data: weightLogs.map(l => l.body_weight_kg),
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37,99,235,.1)',
        fill: true,
        tension: 0.3,
        pointRadius: 5
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

function renderRepsChart() {
  // Aggregate total reps per exercise per date
  const exerciseNames = new Set();
  logs.forEach(l => (l.exercises || []).forEach(e => exerciseNames.add(e.name)));

  const datasets = [];
  const colors = ['#0d9668', '#d63031', '#2563eb', '#e67e22', '#8e44ad', '#1abc9c'];
  let ci = 0;
  
  for (const name of exerciseNames) {
    const data = logs.map(l => {
      const exs = (l.exercises || []).filter(e => e.name === name);
      return exs.reduce((s, e) => s + (e.actual || 0), 0) || null;
    });
    datasets.push({
      label: name,
      data,
      borderColor: colors[ci % colors.length],
      tension: 0.3,
      pointRadius: 4,
      spanGaps: true
    });
    ci++;
  }

  const ctx = document.getElementById('repsChart').getContext('2d');
  if (window._repsChart) window._repsChart.destroy();
  window._repsChart = new Chart(ctx, {
    type: 'line',
    data: { labels: logs.map(l => l.date.slice(5)), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
      scales: { y: { beginAtZero: true, title: { display: true, text: 'Повторений (сумма)' } } }
    }
  });
}

function renderDiffChart() {
  // Show difficulty distribution per workout as stacked bar
  const diffMap = { easy: 0, normal: 1, hard: 2 };
  const easyData = [], normalData = [], hardData = [];
  
  logs.forEach(l => {
    let e = 0, n = 0, h = 0;
    (l.exercises || []).forEach(ex => {
      if (ex.difficulty === 'easy') e++;
      else if (ex.difficulty === 'hard') h++;
      else n++;
    });
    easyData.push(e); normalData.push(n); hardData.push(h);
  });

  const ctx = document.getElementById('diffChart').getContext('2d');
  if (window._diffChart) window._diffChart.destroy();
  window._diffChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: logs.map(l => l.date.slice(5)),
      datasets: [
        { label: '😊 Легко', data: easyData, backgroundColor: '#0d9668' },
        { label: '💪 Нормально', data: normalData, backgroundColor: '#e67e22' },
        { label: '🔥 Сложно', data: hardData, backgroundColor: '#d63031' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Подходов' } } }
    }
  });
}

function renderLogTable() {
  const body = document.getElementById('logBody');
  body.innerHTML = logs.map(l => `
    <tr>
      <td>${l.date}</td>
      <td>${l.workout || l.title || '—'}</td>
      <td>${l.duration_min || '—'} мин</td>
      <td>${l.body_weight_kg || '—'}</td>
      <td>${l.streak ? '🔥' + l.streak : '—'}</td>
    </tr>
  `).join('');
}

// Auto-render on load
renderDashboard();
</script>
</body>
</html>
